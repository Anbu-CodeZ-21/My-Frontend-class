<!DOCTYPE html>
<html>
<head>
    <title>Toggle Theme</title>
    <style>
        .card {
            width: 300px;
            padding: 30px;
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        .dark {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>

    <div id="card" class="card">
        <h2>Box</h2>
        <p>This is my Box</p>
    </div>

    <button id="btn"> Theme</button>

    <script src="assets/js/Task-3.js"></script>
</body>
</html>
