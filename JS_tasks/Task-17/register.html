<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>

<body>
    <form id="form">
        <h2>Register Page</h2>
        <table border="2" cellpadding="10">
            <tr>
                <td><input type="text" placeholder="enter your name" id="username" required></td>
            </tr>
            
            <tr>
                <td><input type="email" placeholder="enter your email" id="email" required></td>
            </tr>
            <tr>
                <td><input type="password" placeholder="enter your password" id="password" minlength="8" required></td>
            </tr>
            <br>
            

        </table>
        <p>I Already have an Account <a href="login.html">Login</a></p>
        
        <br>
        <button id="btn">Register</button>


    </form>

    
    
    <script src="assets/js/register.js"></script>
</body>

</html>
