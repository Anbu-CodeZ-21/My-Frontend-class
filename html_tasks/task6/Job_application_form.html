<head>
        <title>JOB APPLICATION FORM</title>
    </head>
    <body>
        <header>
            <h1>JOB APPLICATION FORM</h1>
        </header>
        <section>
            <h2>PERSONAL INFORMATION</h2>
            <label>FIRST NAME</label>
            <input type="text" placeholder="enter your name" required>
            <label>LASTNAME</label>
            <input type="text" placeholder="enter your last name" required>
            <label>EMAIL</label>
            <input type="email" placeholder="enter your email" required>
            <label>MOBILE NUMBER</label>
            <input type="tel" placeholder="enter your number" minlength="10" maxlength="10" required>
            <label>ADDRESS</label>
            <input type="text" placeholder="enter your address" required>
            <label>CITY</label>
            <input type="text" placeholder="enter your city" required>
            <label>STATE</label>
            <input type="text" placeholder="enter your state" required>
            <label>PINCODE</label>
            <input type="number" placeholder="enter pincode" minlength="6" maxlength="6" required> 
            <h2>EDUCATION</h2>
            <label>COLLEGE NAME</label>
            <input type="text" placeholder="enter your college name" required>
            <label>GRADUATION YEAR</label>
            <input type="number" placeholder="passout year" required>
            <input type="submit">
        </section>
    </body>
</html>
