<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY WEBPAGE</title>
</head>

<body>
    <main>
    <section>
        <div>
            <h1>IMAGE GALLERY</h1>
            <img src="assets/images/actor.jpg" alt="image" width="300" height="300">
            <img src="assets/images/bike.jpg" alt="image" width="300" height="300">
            <img src="assets/images/car.jpg" alt="image" width="300" height="300">
        </div>
    </section>
    <section>
        <div>
            <h1>AUDIO FILE</h1>
            <audio controls muted autoplay>
                <source src="assets/audio/1.mpeg" type="audio/mpeg" />

            </audio>
        </div>
    </section>
    <section>
        <div>
            <h1>Video Player</h1>
            <video controls muted loop width="700" height="500" poster="assets/images/car.jpg" autoplay>
                <source src="assets/videos/1.mp4" type="video/mp4" />
            </video>
        </div>
    </section>
    <section>
        <div>
            <h2>YOUTUBE VIDEO</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/Aze7zTyIRtk?si=IFd9XadjjVp-toya"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>
    <section>
        <div>
            <h2>GOOGLE MAP</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15595.852636557302!2d79.40688315!3d12.2507724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5335719d9322b1%3A0xe5a6d6e2d6e6c6aa!2sGingee%2C%20Tamil%20Nadu%20604202!5e0!3m2!1sen!2sin!4v1784816539776!5m2!1sen!2sin"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </section>
    <section>
        <div>
            <h2>Embedded pdf</h2>
            <iframe src="assets/pdf/1.pdf" frameborder="2"></iframe>

        </div>
    </section>
    </main>
    <center>
    <footer>&copy; This is my media showcase webpage</footer>
     </center>

</body>

</html>
