<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Elements Demo</title>
</head>
<body>

    <!-- Heading -->
    <h1>Welcome to HTML Elements Demo</h1>

    <!-- Paragraph -->
    <p>This is a paragraph demonstrating different HTML elements.</p>

    <!-- Bold Text -->
    <b>This is bold text.</b>
    <br><br>

    <!-- Italic Text -->
    <i>This is italic text.</i>
    <br><br>

    <!-- Highlighted Text -->
    <mark>This text is highlighted.</mark>
    <br><br>

    <!-- Button -->
    <button>Click Me</button>
    <br><br>

    <!-- Input Field -->
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
    <br><br>

    <!-- Dropdown -->
    <label for="course">Choose a Course:</label>
    <select id="course">
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
    </select>
    <br><br>

    <!-- Textarea -->
    <label for="message">Message:</label><br>
    <textarea id="message" rows="4" cols="40" placeholder="Write your message here"></textarea>

</body>
</html>
