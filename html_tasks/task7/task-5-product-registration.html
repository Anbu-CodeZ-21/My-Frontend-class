<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT REGISTRATION FORM</title>
</head>
<body>
    <section>
        <div>
            <form>
                <label for="id">Product ID</label>
                <input type="text" placeholder="enter id" id="id" required>
                <br><br>
                <label for="name">Product Name</label>
                <input type="text" placeholder="enter product name" id="name" required>
                <br><br>
                <label for="Brand">Brand</label>
                <input type="text" placeholder="enter Brand name" id="Brand" required>
                <br><br>
                <label for="category">Category</label>
                <input type="text" placeholder="enter category" id="category" required>
                <br><br>
                <label for="amount">price</label>
                <input type="number" placeholder="enter price amount" id="amount" required>
                <br><br>
                <label for="Quantiity">Quantiity</label>
                <input type="text" id="Quantiity" required>
                <br><br>
                <label for="Supplier">Supplier</label>
                <input type="text"  id="supplier" required>
                <br><br>
                <label for="image">Product Image</label>
                <input type="file" required>
                <br><br>
                <button type="submit">SUBMIT</button>

            </form>
        </div>
    </section>
    <br><br>
    <section>
        <div>
            <table border="2">
                <thead>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Brand</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Stock Status</th>
                </thead>
                <tbody>
                    <tr>
                        <td>001</td>
                        <td>wireless mouse</td>
                        <td>logitec</td>
                        <td>799</td>
                        <td>25</td>
                        <td>in stock</td>
                    </tr>
                    <tr>
                        <td>002</td>
                        <td>keyboard</td>
                        <td>reddragon</td>
                        <td>2499</td>
                        <td>10</td>
                        <td>low stock</td>
                    </tr>
                </tbody>

            </table>
        </div>
    </section>
    
</body>
</html>
