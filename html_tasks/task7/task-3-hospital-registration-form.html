<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital</title>
</head>
<body>
    <section>
        <div>
            <form>
                <h1>HOSPITAL REGISTRATION FORM</h1>
                <label for="id">Patient ID</label>
                <input type="text" placeholder="patient id" id="id" required>
                <br><br>
                <label for="name">Patient Name</label>
                <input type="text" placeholder="enter patient name" id="name" required>
                <br><br>
                <label for="userage">Age</label>
                <input type="number" placeholder="enter your age" id="userage" minlength="1" maxlength="2" required>
                <br><br>
                <label for="usergender">Gender</label>
                <input type="radio" id="usergender" name="gender">MALE
                <input type="radio" id="usergender" name="gender">FEMALE
                <br><br>
                <label for="blood">Blood Group</label>
                <input type="text" placeholder="enter blood group" id="blood" required>
                <br><br>
                <label for="name">Doctor</label>
                <input type="text" placeholder="enter doctor name" id="name" required>
                <br><br>
                <label for="date">Appointment Date</label>
                <input type="date" required>
                <br><br>
                <label for="symptoms">Symptoms</label>
                <input type="text" required>
                <br><br>
                <label for="image">Medical Report Upload </label>
                <input type="file" required>
                <br><br>
                <button type="submit">SUBMIT</button>
            </form>
        </div>
    </section>
    <br><br>
    <section>
        <div>
            <table border="2">
                <thead>
                <th>Patient ID</th>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Blood Group</th>
                <th>Appointment Date</th>
                <th>Status</th>
                </thead>

    </section>

    
</body>
</html>
